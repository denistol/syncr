[package]
name = "rsync"
version = "0.1.0"
edition = "2024"

[dependencies]
ignore = "0.4.25"
bincode = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
blake3 = "1.8.2"
rayon = "1.11.0"

[[bin]]
name="main"
path="src/main.rs"

[[bin]]
name="example"
path="src/example.rs"
